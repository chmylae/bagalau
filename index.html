<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бағалау</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--soft:#f8fafc;
  --brand:#4f46e5;--ok:#059669;--okbg:#e7f8ef;--mid:#2563eb;--midbg:#e8f0fe;--low:#b45309;--lowbg:#fef3e2;--bad:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b1020;--card:#141a2e;--ink:#e6e9f2;--muted:#94a0b8;--line:#263050;--soft:#10162a;
    --okbg:#0f2e22;--midbg:#13234a;--lowbg:#33240c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--muted);border:1px solid transparent}
nav a.on{background:var(--brand);color:#fff}
nav a:not(.on):hover{border-color:var(--line)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.dot.on{background:#10b981}.dot.err{background:var(--bad)}
.banner{background:var(--lowbg);color:var(--low);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.badge{width:48px;height:48px;border-radius:14px;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stat .val{font-size:26px;font-weight:800;margin-top:6px}
.stat .hint{font-size:12px;color:var(--muted);margin-top:2px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft)}
th small{display:block;font-weight:500;text-transform:none;letter-spacing:0}
td.name,th.name{text-align:left}
td.name input{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);width:100%;padding:2px 0}
td.name input.note{font-weight:400;font-size:12px;color:var(--muted)}
td.name input:focus{outline:1px dashed var(--line)}
select{font:inherit;padding:5px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.total{font-weight:800;font-size:18px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-mid{background:var(--midbg);color:var(--mid)}.p-low{background:var(--lowbg);color:var(--low)}
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad)}
.btn.x{padding:4px 8px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.crit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.crit .card{padding:14px}
.crit b{display:block;margin-bottom:4px}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gcard{border-top:5px solid var(--c)}
.gcard ol{margin:10px 0 0;padding:0;list-style:none}
.gcard li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.gcard li span.n{flex:1}
.gcard li .sc{font-weight:800}
.rank{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rank .card{flex:1;min-width:200px;padding:14px;display:flex;gap:12px;align-items:center}
.medal{font-size:26px}
.big{font-size:30px;font-weight:800}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.links .card{padding:12px;font-size:13px;word-break:break-all}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.role{font:inherit;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;border-left:6px solid var(--c)}
.role b{display:block;font-size:16px}.role span{font-size:12px;color:var(--muted)}
.role.on{border-color:var(--c);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.codein{flex:1;font:inherit;font-size:18px;letter-spacing:.2em;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.groups,.links{grid-template-columns:1fr}.crit{grid-template-columns:1fr}}
@media print{header.top,.bar,.btn,.banner{display:none!important}body{background:#fff}}
</style>
<script src="config.js?v=2"></script>
<script src="data.js?v=2"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#teacher"><i>Б</i>Бағалау</a>
  <span class="status"><span id="dot" class="dot"></span><span id="stxt">…</span></span>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="app.js?v=2"></script>
</body>
</html>
